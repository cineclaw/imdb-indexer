[package]
name = "imdb-indexer"
version = "1.0.0"
edition = "2021"

[lib]
name = "imdb_indexer"
path = "src/lib.rs"

[[bin]]
name = "imdb-indexer"
path = "src/main.rs"

[dependencies]
# Search Engine
tantivy = "0.22"

# Async Runtime & HTTP Server
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# HTTP Client for Dumps Download
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"

# Compression & Parsing
flate2 = "1.0"
csv = "1.3"

# Embedded zero-RAM disk store for streaming ingestion
redb = "2.1"

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Logging & Error Handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
lru = "0.12"

[dev-dependencies]
tempfile = "3"
tower = "0.5"
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

